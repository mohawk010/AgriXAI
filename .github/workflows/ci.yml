name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Stage 0: Security Scan ────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: TruffleHog Secret Scan
      uses: trufflesecurity/trufflehog@main
      with:
        extra_args: --only-verified

  # ── Stage 1: Lint ──────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    needs: security
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install linting tools
      run: pip install flake8

    - name: Run flake8
      run: |
        flake8 app/ utils/ \
          --max-line-length=120 \
          --extend-ignore=E402,W503 \
          --count --show-source --statistics

  # ── Stage 2: Test ──────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest httpx Pillow

    - name: Run test suite
      run: pytest test/test_api.py -v

  # ── Stage 3: Docker Build ──────────────────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: test
    # Only build on pushes to main, not on PRs (saves CI minutes)
    if: github.event_name == 'push'
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -t ghcr.io/${{ github.repository }}:${{ github.sha }} .
        echo "Docker image built successfully: ghcr.io/${{ github.repository }}:${{ github.sha }}"

    - name: Push image
      run: |
        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
        docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

  # ── Stage 4: Deploy (Template) ─────────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
    - name: Deploy placeholder
      run: |
        echo "═══════════════════════════════════════════════════════════"
        echo "  DEPLOY STAGE — Ready for integration"
        echo ""
        echo "  To deploy, replace this step with your target platform:"
        echo "    • AWS ECS:  aws ecs update-service ..."
        echo "    • GCP:      gcloud run deploy ..."
        echo "    • Azure:    az container create ..."
        echo "    • Self-hosted: docker-compose pull && docker-compose up -d"
        echo "═══════════════════════════════════════════════════════════"
